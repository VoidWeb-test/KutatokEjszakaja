<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Szerencsekerék · Student Tech Lab ELTE</title>
<meta name="description" content="Interaktív szerencsekerék a Student Tech Lab ELTE nyílt napjára.">

<link rel="icon" type="image/png" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --navy:#012850;        /* elsődleges sötét navy – címsorok, szövegek, kerék */
    --navy-mid:#1a3d61;    /* footer sáv / másodlagos kerék-szín */
    --navy-soft:#4d7ea8;   /* halvány, harmadlagos kék árnyalat */
    --hex-gray:#f2f2f2;    /* vízjel-minta színe */
    --paper:#ffffff;
    --ink-muted:#5c6672;
    --line:#c9d3dc;
    --radius:16px;
    --mono:'Space Mono','Consolas',monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100svh;
    background:var(--paper);
    color:var(--navy);
    font-family:var(--sans);
    position:relative;
  }

  .page{position:relative;min-height:100svh;display:flex;flex-direction:column;}

  #bgFx{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none;display:block;}

  .hex-watermark{
    position:absolute; inset:0;
    background-image:url('logo.png');
    background-repeat:space;
    background-size:64px 64px;
    opacity:0.05;
    pointer-events:none;
    z-index:0;
  }

  .content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;flex:1;min-height:0;width:100%;padding:28px 16px 14px;}

  /* ---------- Fejléc ---------- */
  header{flex:0 0 auto;display:flex;align-items:center;gap:12px;margin-bottom:8px;}
  .logo-mark{width:42px;height:42px;flex:none;display:block;}
  .logo-fallback{width:42px;height:42px;flex:none;}
  .brand{display:flex;flex-direction:column;line-height:1.2;}
  .brand .lab{font-family:var(--sans);font-weight:800;font-size:19px;color:var(--navy);}

  /* ---------- Instrukció ---------- */
  .instruction{
    flex:0 0 auto;
    text-align:center;
    max-width:480px;
    margin:14px 0 24px;
  }
  .instruction p{
    margin:0;
    font-size:19px;
    font-weight:600;
    color:var(--navy);
  }
  .instruction kbd{
    font-family:var(--mono);
    font-weight:700;
    font-size:16px;
    background:var(--paper);
    border:2px solid var(--navy);
    border-bottom-width:4px;
    border-radius:8px;
    padding:3px 12px;
    color:var(--navy);
    display:inline-block;
  }

  .wheel-wrap{position:relative;flex:1 1 auto;min-height:200px;width:100%;display:flex;align-items:center;justify-content:center;padding:4px 0;}
  .wheel-square{position:relative;}
  .pointer{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:34px;height:38px;z-index:3;filter:drop-shadow(0 4px 8px rgba(1,40,80,0.35));}
  canvas#wheel{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 18px 44px rgba(1,40,80,0.28);background:var(--paper);}
  .hub{
    position:absolute;top:50%;left:50%;width:17%;height:17%;transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--navy-soft), var(--navy) 75%);
    border:3px solid var(--paper);
    box-shadow:0 0 0 2px var(--navy), 0 6px 14px rgba(1,40,80,0.4);
    z-index:2;
  }

  .qr-badge{
    position:absolute;
    left:75%; bottom:14px;
    transform:translateX(-50%);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 14px 8px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    box-shadow:0 8px 20px rgba(1,40,80,0.18);
    z-index:2;
  }
  .qr-badge img{width:144px;height:144px;display:block;border-radius:6px;}
  .qr-badge span{font-family:var(--mono);font-size:11px;color:var(--ink-muted);letter-spacing:.02em;}
  @media (max-width:560px){ .qr-badge{display:none;} }

  [aria-live]{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

  /* ---------- Nyeremény popup ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(1,40,80,0.35);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;
    transition:opacity .12s ease;z-index:10;padding:20px;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .prize-card{
    width:min(90vw,380px);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:32px 26px 26px;
    text-align:center;
    box-shadow:0 30px 70px rgba(1,40,80,0.35);
    transform:scale(.86) translateY(14px);
    transition:transform .16s cubic-bezier(.2,1.4,.4,1);
  }
  .overlay.show .prize-card{transform:scale(1) translateY(0);}
  .prize-card .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--navy-soft);margin-bottom:10px;}
  .prize-card .prize-name{font-family:var(--sans);font-weight:800;font-size:24px;color:var(--navy);line-height:1.25;margin-bottom:18px;}
  .prize-card .hint{font-family:var(--mono);font-size:11.5px;color:var(--ink-muted);}
  .prize-card .hint kbd{background:#f3f5f8;border:1px solid var(--line);border-radius:5px;padding:2px 7px;color:var(--navy);}

  /* ---------- Footer (a Student Tech Lab honlap stílusa) ---------- */
  footer.site-footer{position:relative;z-index:1;margin-top:auto;}
  .copy-bar{background:var(--navy-mid);color:#eef3f8;text-align:center;padding:18px 16px;font-size:14px;}

  a:focus-visible, kbd:focus-visible{outline:2px solid var(--navy-soft);outline-offset:2px;}

  @media (max-width:480px){
    .brand .lab{font-size:16px;}
    .instruction p{font-size:17px;}
  }
</style>
</head>
<body>
<div class="page">
  <canvas id="bgFx" aria-hidden="true"></canvas>
  <div class="hex-watermark" aria-hidden="true"></div>

  <div class="content">
    <header>
      <img class="logo-mark" id="logoImg" src="logo.png" alt="Student Tech Lab logó"
           onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';">
      <svg class="logo-fallback" id="logoFallback" style="display:none" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Student Tech Lab jel">
        <polygon points="50,4 92,27 92,73 50,96 8,73 8,27" fill="none" stroke="#012850" stroke-width="4"/>
      </svg>
      <div class="brand">
        <span class="lab">Student Tech Lab</span>
      </div>
    </header>

    <div class="instruction">
      <p>Nyomd meg az <kbd>ENTER</kbd> billentyűt a pörgetéshez!</p>
    </div>

    <div class="wheel-wrap" id="wheelWrap">
      <div class="wheel-square" id="wheelSquare">
        <svg class="pointer" viewBox="0 0 34 38" xmlns="http://www.w3.org/2000/svg">
          <path d="M17 38 L2 10 Q17 20 32 10 Z" fill="#012850" stroke="#ffffff" stroke-width="1.5"/>
        </svg>
        <canvas id="wheel"></canvas>
        <div class="hub"></div>
      </div>
      <div class="qr-badge">
        <img id="qrImg" alt="QR kód" width="144" height="144">
        <span>Olvass be!</span>
      </div>
    </div>
  </div>

  <div aria-live="polite" id="liveRegion"></div>

  <div class="overlay" id="overlay">
    <div class="prize-card">
      <div class="kicker">GRATULÁLUNK</div>
      <div class="prize-name" id="prizeName">—</div>
      <div class="hint">Nyomj <kbd>ESC</kbd>-et az újrakezdéshez</div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="copy-bar">© <span id="year"></span> Student Tech Lab ELTE.</div>
  </footer>
</div>

<script>
(function(){
  "use strict";

  document.getElementById('year').textContent = new Date().getFullYear();

  /* =========================================================
     KONFIGURÁCIÓ — ide nyúlj, ha testre akarod szabni a kereket
     ========================================================= */
  const PRIZES = [
    { label: "Sima STL kulcstartó", weight: 10, color: "#012850" },
    { label: "Toll",                weight: 3,  color: "#ef8354" },
    { label: "Fidget",              weight: 3,  color: "#2fae8b" },
    { label: "STL+ kulcstartó",     weight: 3,  color: "#7a5fd1" },
    { label: "Notesz (fődíj)",      weight: 1,  color: "#d8ac48" }
  ];
  // weight-arányok: 10:3:3:3:1 = 50% / 15% / 15% / 15% / 5% 

  const SPIN_DURATION_MS = 5200;  // teljes pörgés hossza
  const MIN_EXTRA_TURNS  = 5;     // minimum ennyi teljes kör extra pörgetés
  const MAX_EXTRA_TURNS  = 8;

  const QR_TARGET_URL = "https://studenttechlab.hu/";

  const EASE_RISE  = 1;
  const EASE_DECAY = 12;

  /* =========================================================
     Canvas előkészítés
     ========================================================= */
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const N = PRIZES.length;

  // szeletek határai fokban, a weight-ek arányában (nem egyenlő osztás!)
  const TOTAL_WEIGHT = PRIZES.reduce((s,p)=>s+p.weight, 0);
  const segBounds = [];
  (function buildSegments(){
    let acc = 0;
    for(const p of PRIZES){
      const start = acc/TOTAL_WEIGHT*360;
      acc += p.weight;
      const end = acc/TOTAL_WEIGHT*360;
      segBounds.push({start, end});
    }
  })();

  function pickWeightedIndex(){
    const r = Math.random()*TOTAL_WEIGHT;
    let acc = 0;
    for(let i=0;i<PRIZES.length;i++){
      acc += PRIZES[i].weight;
      if(r < acc) return i;
    }
    return PRIZES.length-1;
  }

  let rotation = 0;
  let dpr = Math.max(1, window.devicePixelRatio || 1);
  let size = 0;

  const wheelWrap = document.getElementById('wheelWrap');
  const wheelSquare = document.getElementById('wheelSquare');

  // A wheel-wrap adja a rendelkezésre álló (fejléc és footer közti) teret;
  // itt vesszük a szélesség/magasság kisebbikét, hogy a kerék mindig
  // tökéletes kör maradjon, és pont kitöltse ezt a teret.
  function sizeWheel(){
    const rect = wheelWrap.getBoundingClientRect();
    const s = Math.max(160, Math.min(rect.width, rect.height) - 8);
    wheelSquare.style.width = s + 'px';
    wheelSquare.style.height = s + 'px';
    resizeCanvas();
  }

  function resizeCanvas(){
    const rect = canvas.getBoundingClientRect();
    size = rect.width;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    drawWheel();
  }

  function pickTextColor(hex){
    // olvasható szövegszín (fehér vagy navy) a szelet háttérszínéhez, kontraszt alapján —
    // ez javítja azt, hogy pl. az arany "Notesz" szeleten a fehér szöveg alig látszott
    const c = hex.replace('#','');
    const r = parseInt(c.substring(0,2),16), g = parseInt(c.substring(2,4),16), b = parseInt(c.substring(4,6),16);
    const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
    return lum > 0.6 ? '#012850' : '#ffffff';
  }

  function drawWheel(){
    const r = size/2;
    ctx.clearRect(0,0,size,size);
    ctx.save();
    ctx.translate(r,r);
    ctx.rotate(rotation * Math.PI/180);

    for(let i=0;i<N;i++){
      const start = segBounds[i].start * Math.PI/180;
      const end   = segBounds[i].end   * Math.PI/180;
      const angleSpan = end - start;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.arc(0,0,r-4, start, end);
      ctx.closePath();
      ctx.fillStyle = PRIZES[i].color;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();

      ctx.save();
      ctx.rotate(start + angleSpan/2);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillStyle = pickTextColor(PRIZES[i].color);
      ctx.font = "600 " + Math.max(10, r*0.062) + "px Inter, sans-serif";
      // a szövegtördelés szélessége a szelet szögéhez igazodik: a nagy (50%-os)
      // szelet kap bőven helyet egy sorban, a keskeny szeletek (pl. 5%) inkább
      // több, rövidebb sorra törnek
      const maxWidth = Math.max(24, Math.min(r-18, r*0.75*angleSpan));
      wrapRadialText(PRIZES[i].label, r-18, maxWidth);
      ctx.restore();
    }
    ctx.restore();
  }

  function wrapRadialText(text, xStart, maxWidth){
    const words = text.split(' ');
    let lines = [];
    let cur = '';
    for(const w of words){
      const test = cur ? cur+' '+w : w;
      if(ctx.measureText(test).width > maxWidth && cur){
        lines.push(cur);
        cur = w;
      } else {
        cur = test;
      }
    }
    if(cur) lines.push(cur);
    const lh = parseInt(ctx.font,10) * 1.15 || 14;
    const offsetStart = -((lines.length-1)*lh)/2;
    lines.forEach((line,idx)=>{
      ctx.fillText(line, xStart, offsetStart + idx*lh);
    });
  }

  window.addEventListener('resize', sizeWheel);
  if(window.ResizeObserver){
    new ResizeObserver(sizeWheel).observe(wheelWrap);
  }

  /* =========================================================
     QR kód — kliensoldalon generálva egy ingyenes, kulcs nélküli
     szolgáltatással, a látogató böngészőjében (internetkapcsolat kell,
     ami GitHub Pages-en amúgy is adott).
     ========================================================= */
  document.getElementById('qrImg').src =
    'https://api.qrserver.com/v1/create-qr-code/?size=360x360&margin=1&data=' +
    encodeURIComponent(QR_TARGET_URL);

  /* =========================================================
     Háttér-animáció: a logo.png lebeg és forog a háttérben.
     Amíg nincs feltöltve a logo.png, egy egyszerű hatszög-körvonal
     helyettesíti (ugyanaz a helyettesítő jel, mint a fejlécben).
     ========================================================= */
  (function backgroundFx(){
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduceMotion) return;

    const fxCanvas = document.getElementById('bgFx');
    const fxCtx = fxCanvas.getContext('2d');
    const FX_COUNT = 16;
    let fxW = 0, fxH = 0;

    const bgLogo = new Image();
    let bgLogoLoaded = false;
    let bgLogoAspect = 1;
    bgLogo.onload = function(){
      bgLogoLoaded = true;
      bgLogoAspect = (bgLogo.naturalWidth / bgLogo.naturalHeight) || 1;
    };
    bgLogo.onerror = function(){ bgLogoLoaded = false; };
    bgLogo.src = 'logo.png';

    function resizeFx(){
      fxW = window.innerWidth;
      fxH = window.innerHeight;
      fxCanvas.width = fxW * dpr;
      fxCanvas.height = fxH * dpr;
      fxCanvas.style.width = fxW + 'px';
      fxCanvas.style.height = fxH + 'px';
      fxCtx.setTransform(dpr,0,0,dpr,0,0);
    }
    window.addEventListener('resize', resizeFx);
    resizeFx();

    function rand(min,max){ return min + Math.random()*(max-min); }

    function spawnParticle(spreadOverScreen){
      return {
        x: rand(0, fxW),
        y: spreadOverScreen ? rand(-fxH, fxH) : rand(-90, -20),
        size: rand(26, 58),
        vy: rand(14, 34),
        rot: rand(0, Math.PI*2),
        vr: (Math.random()<0.5?-1:1) * rand(0.2, 0.8),
        alpha: rand(0.14, 0.30)
      };
    }

    const particles = Array.from({length: FX_COUNT}, () => spawnParticle(true));

    function drawLogoParticle(c, size, alpha){
      c.save();
      c.globalAlpha = alpha;
      if(bgLogoLoaded){
        let w = size, h = size;
        if(bgLogoAspect >= 1){ h = size / bgLogoAspect; } else { w = size * bgLogoAspect; }
        c.drawImage(bgLogo, -w/2, -h/2, w, h);
      } else {
        c.strokeStyle = '#012850';
        c.lineWidth = Math.max(1.5, size*0.06);
        c.beginPath();
        const pts = [[0,-1],[0.87,-0.5],[0.87,0.5],[0,1],[-0.87,0.5],[-0.87,-0.5]];
        pts.forEach(function(p,i){
          const x = p[0]*size*0.5, y = p[1]*size*0.5;
          if(i===0) c.moveTo(x,y); else c.lineTo(x,y);
        });
        c.closePath();
        c.stroke();
      }
      c.restore();
    }

    let lastT = performance.now();
    function loop(now){
      const dt = Math.min(0.05, (now-lastT)/1000);
      lastT = now;
      fxCtx.clearRect(0,0,fxW,fxH);
      for(const p of particles){
        p.y += p.vy*dt;
        p.rot += p.vr*dt;
        if(p.y - p.size > fxH){
          Object.assign(p, spawnParticle(false));
        }
        fxCtx.save();
        fxCtx.translate(p.x, p.y);
        fxCtx.rotate(p.rot);
        drawLogoParticle(fxCtx, p.size, p.alpha);
        fxCtx.restore();
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  })();

  /* =========================================================
     Hangeffektek — Web Audio API-val szintetizálva, külső
     hangfájl nélkül (GitHub Pages-en is gond nélkül fut).
     ========================================================= */
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTick(strength){
    if(!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(900 + strength*300, t);
    gain.gain.setValueAtTime(0.001, t);
    gain.gain.exponentialRampToValueAtTime(0.16 + strength*0.06, t+0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, t+0.045);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t+0.05);
  }

  function playWinFanfare(){
    if(!audioCtx) return;
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((f,i)=>{
      const t = audioCtx.currentTime + i*0.09;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.18, t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t+0.35);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t+0.4);
    });
  }

  /* =========================================================
     Állapotgép + pörgetés-animáció
     ========================================================= */
  const overlay = document.getElementById('overlay');
  const prizeNameEl = document.getElementById('prizeName');
  const liveRegion = document.getElementById('liveRegion');

  let state = 'idle';       // 'idle' | 'spinning' | 'result'
  let rafId = null;
  let lastTickSeg = null;

  // Előre kiszámított táblázat: a v(t)=t^RISE*(1-t)^DECAY sebességgörbe
  // numerikus integrálja (trapéz-szabály), normálva 0..1 közé. Ebből
  // interpolálva kapjuk a forgás arányát (pozíció) és a pillanatnyi
  // sebességet is (utóbbi a kattogás hangerejéhez kell).
  const EASE_SAMPLES = 480;
  const easeVelocity = new Array(EASE_SAMPLES+1);
  const easePosition = new Array(EASE_SAMPLES+1);
  (function buildEaseTable(){
    let maxV = 0;
    for(let i=0;i<=EASE_SAMPLES;i++){
      const t = i/EASE_SAMPLES;
      const v = Math.pow(t, EASE_RISE) * Math.pow(1-t, EASE_DECAY);
      easeVelocity[i] = v;
      if(v > maxV) maxV = v;
    }
    for(let i=0;i<=EASE_SAMPLES;i++) easeVelocity[i] /= maxV; // 0..1, csak a hangerőhöz

    let cum = 0;
    const raw = new Array(EASE_SAMPLES+1);
    raw[0] = 0;
    for(let i=1;i<=EASE_SAMPLES;i++){
      const t = i/EASE_SAMPLES;
      const v = Math.pow(t, EASE_RISE) * Math.pow(1-t, EASE_DECAY);
      const vPrev = Math.pow((i-1)/EASE_SAMPLES, EASE_RISE) * Math.pow(1-(i-1)/EASE_SAMPLES, EASE_DECAY);
      cum += (v + vPrev) / 2 / EASE_SAMPLES;
      raw[i] = cum;
    }
    const total = raw[EASE_SAMPLES];
    for(let i=0;i<=EASE_SAMPLES;i++) easePosition[i] = raw[i] / total;
  })();

  function lookup(table, t){
    const pos = Math.max(0, Math.min(1, t)) * EASE_SAMPLES;
    const i0 = Math.floor(pos);
    const i1 = Math.min(EASE_SAMPLES, i0+1);
    const frac = pos - i0;
    return table[i0]*(1-frac) + table[i1]*frac;
  }

  function spinEase(t){ return lookup(easePosition, t); }
  function spinVelocity(t){ return lookup(easeVelocity, t); }

  function pointerLocalAngle(rot){
    return ((270 - rot) % 360 + 360) % 360;
  }

  function currentSegmentIndex(rot){
    const angle = pointerLocalAngle(rot);
    for(let i=0;i<N;i++){
      if(angle >= segBounds[i].start && angle < segBounds[i].end) return i;
    }
    return N-1;
  }

  function spin(){
    if(state !== 'idle') return;
    ensureAudio();
    state = 'spinning';
    liveRegion.textContent = 'A kerék pörög…';

    const targetIndex = pickWeightedIndex();
    const seg = segBounds[targetIndex];
    const segWidth = seg.end - seg.start;
    const jitter = (Math.random()-0.5) * segWidth * 0.6;
    const desiredLocal = seg.start + segWidth/2 + jitter;

    const wantedMod = ((270 - desiredLocal) % 360 + 360) % 360;
    const currentMod = ((rotation % 360) + 360) % 360;
    const deltaAlign = ((wantedMod - currentMod) + 360) % 360;
    const extraTurns = MIN_EXTRA_TURNS + Math.floor(Math.random()*(MAX_EXTRA_TURNS-MIN_EXTRA_TURNS+1));
    const totalDelta = extraTurns*360 + deltaAlign;

    const startRotation = rotation;
    const finalRotation = rotation + totalDelta;
    const startTime = performance.now();
    lastTickSeg = currentSegmentIndex(rotation);

    function frame(now){
      const t = Math.min(1, (now-startTime)/SPIN_DURATION_MS);
      const eased = spinEase(t);
      rotation = startRotation + totalDelta*eased;
      drawWheel();

      const seg2 = currentSegmentIndex(rotation);
      if(seg2 !== lastTickSeg){
        playTick(spinVelocity(t));
        lastTickSeg = seg2;
      }

      if(t < 1 && state === 'spinning'){
        rafId = requestAnimationFrame(frame);
      } else if(state === 'spinning'){
        rotation = finalRotation;
        drawWheel();
        finishSpin(targetIndex);
      }
    }
    rafId = requestAnimationFrame(frame);
  }

  function finishSpin(targetIndex){
    state = 'result';
    playWinFanfare();
    const prize = PRIZES[targetIndex];
    prizeNameEl.textContent = prize.label;
    overlay.classList.add('show');
    liveRegion.textContent = 'Nyereményed: ' + prize.label;
  }

  function resetWheel(){
    if(rafId) cancelAnimationFrame(rafId);
    state = 'idle';
    overlay.classList.remove('show');
    rotation = ((rotation % 360) + 360) % 360;
    drawWheel();
    liveRegion.textContent = 'A kerék visszaállt.';
  }

  window.addEventListener('keydown', function(e){
    if(e.repeat) return;
    if(e.key === 'Enter'){
      e.preventDefault();
      spin();
    } else if(e.key === 'Escape'){
      e.preventDefault();
      resetWheel();
    }
  });

  sizeWheel();
})();
</script>
</body>
