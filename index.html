<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Szerencsekerék · Student Tech Lab ELTE</title>
<meta name="description" content="Interaktív szerencsekerék a Student Tech Lab ELTE nyílt napjára.">

<!--
  LOGÓ: tedd az index.html mellé egy "logo.png" nevű, lehetőleg átlátszó hátterű
  fájlt — ez adja majd a böngészőfül ikonját, a fejléc logóját ÉS a háttérben
  megjelenő halvány hatszög-mintát is. Amíg nincs feltöltve a fájl, a fejlécben
  egy egyszerű helyettesítő hatszög jel látszik, a vízjel-minta pedig üres marad.
-->
<link rel="icon" type="image/png" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --navy:#012850;        /* elsődleges sötét navy – címsorok, szövegek, kerék */
    --navy-mid:#1a3d61;    /* footer sáv / másodlagos kerék-szín */
    --navy-soft:#4d7ea8;   /* halvány, harmadlagos kék árnyalat */
    --hex-gray:#f2f2f2;    /* vízjel-minta színe */
    --paper:#ffffff;
    --ink-muted:#5c6672;
    --line:#c9d3dc;
    --radius:16px;
    --mono:'Space Mono','Consolas',monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100svh;
    background:var(--paper);
    color:var(--navy);
    font-family:var(--sans);
    position:relative;
  }

  .page{position:relative;min-height:100svh;display:flex;flex-direction:column;}

  /* háttérben lebegő, 45 fokban jobbra-lefelé sodródó logó-vízjel */
  .hex-watermark{
    position:absolute; inset:0;
    background-image:url('logo.png');
    background-repeat:repeat;
    background-size:130px 130px;
    opacity:0.07;
    pointer-events:none;
    z-index:0;
    animation:bgDrift 26s linear infinite;
  }
  @keyframes bgDrift{
    from{ background-position:0 0; }
    to{ background-position:130px 130px; }
  }
  @media (prefers-reduced-motion: reduce){
    .hex-watermark{ animation:none; }
  }

  .content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;flex:1;min-height:0;width:100%;padding:28px 16px 14px;}

  /* ---------- Instrukció ---------- */
  .instruction{
    flex:0 0 auto;
    text-align:center;
    max-width:480px;
    margin:14px 0 24px;
  }
  .instruction p{
    margin:0;
    font-size:19px;
    font-weight:600;
    color:var(--navy);
  }
  .instruction kbd{
    font-family:var(--mono);
    font-weight:700;
    font-size:16px;
    background:var(--paper);
    border:2px solid var(--navy);
    border-bottom-width:4px;
    border-radius:8px;
    padding:3px 12px;
    color:var(--navy);
    display:inline-block;
  }

  /* ---------- Kerék ---------- */
  /* a wrap kitölti az instrukció alatti teljes szabad teret; */
  /* a benne lévő négyzet (wheel-square) méretét JS állítja be, hogy pontosan */
  /* a rendelkezésre álló szélesség/magasság kisebbikét vegye fel (mindig kör marad) */
  .wheel-wrap{
    position:relative;flex:1 1 auto;min-height:200px;width:100%;
    display:flex;align-items:center;justify-content:center;
    gap:40px;padding:4px 16px;flex-wrap:wrap;
  }
  .wheel-square{position:relative;flex:0 0 auto;}
  .pointer{position:absolute;top:-12px;left:50%;transform:translateX(-50%);width:34px;height:34px;z-index:3;}
  canvas#wheel{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 18px 44px rgba(1,40,80,0.28);background:var(--paper);}
  .hub{
    position:absolute;top:50%;left:50%;width:17%;height:17%;transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--navy-soft), var(--navy) 75%);
    border:3px solid var(--paper);
    box-shadow:0 0 0 2px var(--navy), 0 6px 14px rgba(1,40,80,0.4);
    z-index:2;
  }

  /* ---------- QR kód panel — a kerék mellett, önálló, nagyméretű elemként
  (nem ráhelyezett kis jelvényként, mint korábban) ---------- */
  .qr-panel{
    flex:0 0 auto;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:20px;
    padding:22px 26px 18px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    box-shadow:0 10px 26px rgba(1,40,80,0.18);
  }
  .qr-panel img{width:300px;height:300px;display:block;border-radius:10px;}
  .qr-panel span{font-family:var(--mono);font-size:14px;color:var(--ink-muted);letter-spacing:.02em;}
  @media (max-width:720px){
    .qr-panel{padding:16px 20px 14px;gap:8px;}
    .qr-panel img{width:190px;height:190px;}
    .qr-panel span{font-size:12px;}
  }

  [aria-live]{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

  /* ---------- Nyeremény popup ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(1,40,80,0.35);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;
    transition:opacity .12s ease;z-index:10;padding:20px;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .prize-card{
    width:min(90vw,380px);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:32px 26px 26px;
    text-align:center;
    box-shadow:0 30px 70px rgba(1,40,80,0.35);
    transform:scale(.86) translateY(14px);
    transition:transform .16s cubic-bezier(.2,1.4,.4,1);
  }
  .overlay.show .prize-card{transform:scale(1) translateY(0);}
  .prize-card .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--navy-soft);margin-bottom:10px;}
  .prize-card .prize-name{font-family:var(--sans);font-weight:800;font-size:24px;color:var(--navy);line-height:1.25;margin-bottom:18px;}
  .prize-card .hint{font-family:var(--mono);font-size:11.5px;color:var(--ink-muted);}
  .prize-card .hint kbd{background:#f3f5f8;border:1px solid var(--line);border-radius:5px;padding:2px 7px;color:var(--navy);}

  a:focus-visible, kbd:focus-visible{outline:2px solid var(--navy-soft);outline-offset:2px;}

  @media (max-width:480px){
    .instruction p{font-size:17px;}
  }
</style>
</head>
<body>
<div class="page">
  <div class="hex-watermark" aria-hidden="true"></div>

  <div class="content">
    <div class="instruction">
      <p>Nyomd meg az <kbd>ENTER</kbd> billentyűt a pörgetéshez!</p>
    </div>

    <div class="wheel-wrap" id="wheelWrap">
      <div class="wheel-square" id="wheelSquare">
        <svg class="pointer" viewBox="0 0 34 34" xmlns="http://www.w3.org/2000/svg">
          <path d="M17 32 L3 4 L31 4 Z" fill="#d8ac48" stroke="#012850" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <canvas id="wheel"></canvas>
        <div class="hub"></div>
      </div>
      <div class="qr-panel" id="qrPanel">
        <img id="qrImg" alt="QR kód" width="240" height="240">
        <span>Olvasd be!</span>
      </div>
    </div>
  </div>

  <div aria-live="polite" id="liveRegion"></div>

  <div class="overlay" id="overlay">
    <div class="prize-card">
      <div class="kicker">GRATULÁLUNK</div>
      <div class="prize-name" id="prizeName">—</div>
      <div class="hint">Nyomj <kbd>ESC</kbd>-et az újrakezdéshez</div>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     KONFIGURÁCIÓ — ide nyúlj, ha testre akarod szabni a kereket
     ========================================================= */
  const PRIZES = [
    { label: "Sima STL kulcstartó", weight: 10, color: "#012850" },
    { label: "Toll",                weight: 3,  color: "#ef8354" },
    { label: "Fidget",              weight: 3,  color: "#2fae8b" },
    { label: "STL+ kulcstartó",     weight: 3,  color: "#7a5fd1" },
    { label: "Notesz (fődíj)",      weight: 1,  color: "#d8ac48" }
  ];
  // weight-arányok: 10:3:3:3:1 = 50% / 15% / 15% / 15% / 5% —
  // a szeletek mérete pontosan ezt az arányt követi, hogy a kerék
  // vizuálisan is híven mutassa az esélyeket.

  const SPIN_DURATION_MS = 4800;  // teljes pörgés hossza (felső korlát — lásd lejjebb a korai zárást)
  const MIN_EXTRA_TURNS  = 5;     // minimum ennyi teljes kör extra pörgetés
  const MAX_EXTRA_TURNS  = 8;

  // QR kód — cseréld a data értéket a saját linkedre (pl. visszajelző űrlap,
  // Instagram, weboldal). A kép a látogató böngészőjében, a helyszínen
  // töltődik be, ehhez internetkapcsolat kell (GitHub Pages-en ez adott).
  const QR_TARGET_URL = "https://forms.gle/replace-with-your-link";

  // A sebességgörbe alakja: v(t) = t^RISE * (1-t)^DECAY, t a 0..1 normált idő.
  // Kicsi RISE + mérsékelt DECAY = gyors felpörgés, utána sima lassulás, ami
  // az idő nagy részét ténylegesen látható mozgásra használja (nem "üresjárat").
  // (Korábban DECAY=12 mellett a kerék már a pörgés kb. felénél gyakorlatilag
  // megállt, de a popup csak a teljes idő leteltével jelent meg — ezt oldja meg
  // alább a korai lezárás is.)
  const EASE_RISE  = 1;
  const EASE_DECAY = 6;
  const FINISH_THRESHOLD = 0.9995; // eddig a pozíció-arányig várunk, utána azonnal zárunk
  const POST_SPIN_HOLD_MS = 450;   // ennyit vár a program a popup megjelenítése előtt, hogy a kerék megállása is jól látható legyen

  /* =========================================================
     Canvas előkészítés
     ========================================================= */
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const N = PRIZES.length;

  // szeletek határai fokban, a weight-ek arányában (nem egyenlő osztás!)
  const TOTAL_WEIGHT = PRIZES.reduce((s,p)=>s+p.weight, 0);
  const segBounds = [];
  (function buildSegments(){
    let acc = 0;
    for(const p of PRIZES){
      const start = acc/TOTAL_WEIGHT*360;
      acc += p.weight;
      const end = acc/TOTAL_WEIGHT*360;
      segBounds.push({start, end});
    }
  })();

  function pickWeightedIndex(){
    const r = Math.random()*TOTAL_WEIGHT;
    let acc = 0;
    for(let i=0;i<PRIZES.length;i++){
      acc += PRIZES[i].weight;
      if(r < acc) return i;
    }
    return PRIZES.length-1;
  }

  let rotation = 0;
  let dpr = Math.max(1, window.devicePixelRatio || 1);
  let size = 0;

  const wheelWrap = document.getElementById('wheelWrap');
  const wheelSquare = document.getElementById('wheelSquare');
  const qrPanel = document.getElementById('qrPanel');

  // A kerék a korábbinál kb. 15%-kal nagyobb legyen, amíg ez még jól
  // elfér a rendelkezésre álló helyen.
  const SIZE_BOOST = 1.2;
  // A CSS-ben megadott töréspont (.qr-panel média-lekérdezés) — ez alatt
  // a QR panel a kerék ALÁ kerül (nem mellé), ezért máshogy kell számolni.
  const STACK_BREAKPOINT = 720;

  // A wheel-wrap adja a rendelkezésre álló (instrukció és a lap alja közti)
  // teret; ebből vonjuk le a QR panel helyét (mellette vagy alatta, a
  // képernyőmérettől függően), hogy a kerék mindig tökéletes kör maradjon
  // és pont kitöltse a maradék teret.
  function sizeWheel(){
    const rect = wheelWrap.getBoundingClientRect();
    const qrRect = qrPanel.getBoundingClientRect();
    const stacked = window.innerWidth <= STACK_BREAKPOINT;
    const gap = 40; // egyezik a .wheel-wrap CSS gap értékével

    let availW, availH;
    if(stacked){
      availW = rect.width;
      availH = rect.height - qrRect.height - gap;
    } else {
      availW = rect.width - qrRect.width - gap;
      availH = rect.height;
    }

    let s = Math.max(availW, 0) < Math.max(availH, 0) ? availW : availH;
    s = Math.max(160, (s - 8) * SIZE_BOOST);
    // ne lógjon túl a rendelkezésre álló helyen a felskálázás után
    s = Math.min(s, availW - 8, availH - 8);
    s = Math.max(160, s);

    wheelSquare.style.width = s + 'px';
    wheelSquare.style.height = s + 'px';
    resizeCanvas();
  }

  function resizeCanvas(){
    const rect = canvas.getBoundingClientRect();
    size = rect.width;
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    drawWheel();
  }

  function pickTextColor(hex){
    // olvasható szövegszín (fehér vagy navy) a szelet háttérszínéhez, kontraszt alapján —
    // ez javítja azt, hogy pl. az arany "Notesz" szeleten a fehér szöveg alig látszott
    const c = hex.replace('#','');
    const r = parseInt(c.substring(0,2),16), g = parseInt(c.substring(2,4),16), b = parseInt(c.substring(4,6),16);
    const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
    return lum > 0.6 ? '#012850' : '#ffffff';
  }

  function drawWheel(){
    const r = size/2;
    ctx.clearRect(0,0,size,size);
    ctx.save();
    ctx.translate(r,r);
    ctx.rotate(rotation * Math.PI/180);

    for(let i=0;i<N;i++){
      const start = segBounds[i].start * Math.PI/180;
      const end   = segBounds[i].end   * Math.PI/180;
      const angleSpan = end - start;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.arc(0,0,r-4, start, end);
      ctx.closePath();
      ctx.fillStyle = PRIZES[i].color;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();

      ctx.save();
      ctx.rotate(start + angleSpan/2);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillStyle = pickTextColor(PRIZES[i].color);
      const fontSize = Math.max(10, r*0.062);
      ctx.font = "600 " + fontSize + "px Inter, sans-serif";
      // a szövegtördelés szélessége a szelet szögéhez igazodik: a nagy (50%-os)
      // szelet kap bőven helyet egy sorban, a keskeny szeletek (pl. 5%) inkább
      // több, rövidebb sorra törnek
      const maxWidth = Math.max(24, Math.min(r-18, r*0.75*angleSpan));
      wrapRadialText(PRIZES[i].label, r-18, maxWidth, fontSize);
      ctx.restore();
    }
    ctx.restore();
  }

  function wrapRadialText(text, xStart, maxWidth, fontSize){
    const words = text.split(' ');
    let lines = [];
    let cur = '';
    for(const w of words){
      const test = cur ? cur+' '+w : w;
      if(ctx.measureText(test).width > maxWidth && cur){
        lines.push(cur);
        cur = w;
      } else {
        cur = test;
      }
    }
    if(cur) lines.push(cur);
    // FONTOS: a sorköz a ténylegesen átadott fontSize-ból számol, NEM a
    // ctx.font stringből parseInt-elve — az ugyanis a betűvastagságot
    // ("600") olvasta volna ki a méret helyett, ami a kétsoros feliratokat
    // (pl. a keskeny "Notesz" szeleten) messze a szeleten kívülre tolta.
    const lh = fontSize * 1.15;
    const offsetStart = -((lines.length-1)*lh)/2;
    lines.forEach((line,idx)=>{
      ctx.fillText(line, xStart, offsetStart + idx*lh);
    });
  }

  window.addEventListener('resize', sizeWheel);
  if(window.ResizeObserver){
    new ResizeObserver(sizeWheel).observe(wheelWrap);
  }

  /* =========================================================
     QR kód — kliensoldalon generálva egy ingyenes, kulcs nélküli
     szolgáltatással, a látogató böngészőjében (internetkapcsolat kell,
     ami GitHub Pages-en amúgy is adott).
     ========================================================= */
  document.getElementById('qrImg').src =
    'https://api.qrserver.com/v1/create-qr-code/?size=480x480&margin=1&data=' +
    encodeURIComponent(QR_TARGET_URL);

  /* =========================================================
     A háttér-vízjel (logo.png) diagonálisan sodródik — lásd CSS
     .hex-watermark + @keyframes bgDrift. Nincs hozzá külön JS.
     ========================================================= */

  /* =========================================================
     Hangeffektek — Web Audio API-val szintetizálva, külső
     hangfájl nélkül (GitHub Pages-en is gond nélkül fut).
     ========================================================= */
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTick(strength){
    if(!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(900 + strength*300, t);
    gain.gain.setValueAtTime(0.001, t);
    gain.gain.exponentialRampToValueAtTime(0.16 + strength*0.06, t+0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, t+0.045);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t+0.05);
  }

  function playWinFanfare(){
    if(!audioCtx) return;
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((f,i)=>{
      const t = audioCtx.currentTime + i*0.09;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.18, t+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t+0.35);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t+0.4);
    });
  }

  /* =========================================================
     Állapotgép + pörgetés-animáció
     ========================================================= */
  const overlay = document.getElementById('overlay');
  const prizeNameEl = document.getElementById('prizeName');
  const liveRegion = document.getElementById('liveRegion');

  let state = 'idle';       // 'idle' | 'spinning' | 'result'
  let rafId = null;
  let lastTickSeg = null;

  // Előre kiszámított táblázat: a v(t)=t^RISE*(1-t)^DECAY sebességgörbe
  // numerikus integrálja (trapéz-szabály), normálva 0..1 közé. Ebből
  // interpolálva kapjuk a forgás arányát (pozíció) és a pillanatnyi
  // sebességet is (utóbbi a kattogás hangerejéhez kell).
  const EASE_SAMPLES = 480;
  const easeVelocity = new Array(EASE_SAMPLES+1);
  const easePosition = new Array(EASE_SAMPLES+1);
  (function buildEaseTable(){
    let maxV = 0;
    for(let i=0;i<=EASE_SAMPLES;i++){
      const t = i/EASE_SAMPLES;
      const v = Math.pow(t, EASE_RISE) * Math.pow(1-t, EASE_DECAY);
      easeVelocity[i] = v;
      if(v > maxV) maxV = v;
    }
    for(let i=0;i<=EASE_SAMPLES;i++) easeVelocity[i] /= maxV; // 0..1, csak a hangerőhöz

    let cum = 0;
    const raw = new Array(EASE_SAMPLES+1);
    raw[0] = 0;
    for(let i=1;i<=EASE_SAMPLES;i++){
      const t = i/EASE_SAMPLES;
      const v = Math.pow(t, EASE_RISE) * Math.pow(1-t, EASE_DECAY);
      const vPrev = Math.pow((i-1)/EASE_SAMPLES, EASE_RISE) * Math.pow(1-(i-1)/EASE_SAMPLES, EASE_DECAY);
      cum += (v + vPrev) / 2 / EASE_SAMPLES;
      raw[i] = cum;
    }
    const total = raw[EASE_SAMPLES];
    for(let i=0;i<=EASE_SAMPLES;i++) easePosition[i] = raw[i] / total;
  })();

  function lookup(table, t){
    const pos = Math.max(0, Math.min(1, t)) * EASE_SAMPLES;
    const i0 = Math.floor(pos);
    const i1 = Math.min(EASE_SAMPLES, i0+1);
    const frac = pos - i0;
    return table[i0]*(1-frac) + table[i1]*frac;
  }

  function spinEase(t){ return lookup(easePosition, t); }
  function spinVelocity(t){ return lookup(easeVelocity, t); }

  function pointerLocalAngle(rot){
    return ((270 - rot) % 360 + 360) % 360;
  }

  function currentSegmentIndex(rot){
    const angle = pointerLocalAngle(rot);
    for(let i=0;i<N;i++){
      if(angle >= segBounds[i].start && angle < segBounds[i].end) return i;
    }
    return N-1;
  }

  function spin(){
    if(state !== 'idle') return;
    ensureAudio();
    state = 'spinning';
    liveRegion.textContent = 'A kerék pörög…';

    const targetIndex = pickWeightedIndex();
    const seg = segBounds[targetIndex];
    const segWidth = seg.end - seg.start;
    const jitter = (Math.random()-0.5) * segWidth * 0.6;
    const desiredLocal = seg.start + segWidth/2 + jitter;

    const wantedMod = ((270 - desiredLocal) % 360 + 360) % 360;
    const currentMod = ((rotation % 360) + 360) % 360;
    const deltaAlign = ((wantedMod - currentMod) + 360) % 360;
    const extraTurns = MIN_EXTRA_TURNS + Math.floor(Math.random()*(MAX_EXTRA_TURNS-MIN_EXTRA_TURNS+1));
    const totalDelta = extraTurns*360 + deltaAlign;

    const startRotation = rotation;
    const finalRotation = rotation + totalDelta;
    const startTime = performance.now();
    lastTickSeg = currentSegmentIndex(rotation);

    function frame(now){
      const t = Math.min(1, (now-startTime)/SPIN_DURATION_MS);
      const eased = spinEase(t);
      rotation = startRotation + totalDelta*eased;
      drawWheel();

      const seg2 = currentSegmentIndex(rotation);
      if(seg2 !== lastTickSeg){
        playTick(spinVelocity(t));
        lastTickSeg = seg2;
      }

      if(t < 1 && eased < FINISH_THRESHOLD && state === 'spinning'){
        rafId = requestAnimationFrame(frame);
      } else if(state === 'spinning'){
        rotation = finalRotation;
        drawWheel();
        // rövid szünet, hogy a kerék megállása még látszódjon, mielőtt
        // a nyeremény-popup rátakarna a kerékre
        state = 'settling';
        setTimeout(function(){ finishSpin(targetIndex); }, POST_SPIN_HOLD_MS);
      }
    }
    rafId = requestAnimationFrame(frame);
  }

  function finishSpin(targetIndex){
    state = 'result';
    playWinFanfare();
    const prize = PRIZES[targetIndex];
    prizeNameEl.textContent = prize.label;
    overlay.classList.add('show');
    liveRegion.textContent = 'Nyereményed: ' + prize.label;
  }

  function resetWheel(){
    if(rafId) cancelAnimationFrame(rafId);
    state = 'idle';
    overlay.classList.remove('show');
    rotation = ((rotation % 360) + 360) % 360;
    drawWheel();
    liveRegion.textContent = 'A kerék visszaállt.';
  }

  window.addEventListener('keydown', function(e){
    if(e.repeat) return;
    if(e.key === 'Enter'){
      e.preventDefault();
      spin();
    } else if(e.key === 'Escape'){
      e.preventDefault();
      resetWheel();
    }
  });

  sizeWheel();
})();
</script>
